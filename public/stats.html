<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Floorbound · Play stats</title>
<style>
  body { margin: 0; font-family: system-ui, sans-serif; background: #0b1020; color: #eef3ff; }
  main { max-width: 860px; margin: 0 auto; padding: 24px 16px 48px; }
  h1 { font-size: 22px; letter-spacing: .12em; margin: 0 0 4px; }
  .sub { opacity: .65; margin-bottom: 20px; font-size: 14px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 10px; }
  .card { background: rgba(255,255,255,.05); border: 1px solid rgba(160,200,255,.18); border-radius: 12px; padding: 14px; }
  .card b { display: block; font-size: 26px; }
  .card span { font-size: 12px; opacity: .7; }
  h2 { font-size: 13px; letter-spacing: .14em; text-transform: uppercase; opacity: .6; margin: 26px 0 10px; }
  .row { display: flex; align-items: center; gap: 10px; margin: 5px 0; font-size: 14px; }
  .row .lbl { width: 190px; flex: none; }
  .row .bar { flex: 1; height: 12px; background: rgba(255,255,255,.08); border-radius: 6px; overflow: hidden; }
  .row .bar div { height: 100%; background: #60a5fa; }
  .row .n { width: 40px; text-align: right; opacity: .8; }
  select { background: #1b2340; color: #fff; border: 1px solid #334; border-radius: 6px; padding: 4px 8px; }
</style>
</head>
<body>
<main>
  <h1>FLOORBOUND · PLAY STATS</h1>
  <div class="sub">How people actually play. Last <select id="days"><option>1</option><option selected>7</option><option>30</option></select> days.</div>
  <div id="out">Loading…</div>
</main>
<script>
const GUIDE = ['Moved', 'First hit', 'Dodged', 'First kill', 'Opened bag / potion', 'Joined a party', 'First Switch', 'Reached the Warden', 'Beat the Warden'];
const RAR = ['Common', 'Uncommon', 'Rare', 'Epic', 'Last Attack'];
const pct = (a, b) => (b ? Math.round((a / b) * 100) : 0) + '%';
const mins = s => (s == null ? '–' : s < 90 ? `${Math.round(s)} s` : `${(s / 60).toFixed(1)} min`);
const card = (v, label) => `<div class="card"><b>${v}</b><span>${label}</span></div>`;
const bars = (rows, label, n) => { const max = Math.max(1, ...rows.map(n)); return rows.map(r => `<div class="row"><span class="lbl">${label(r)}</span><span class="bar"><div style="width:${(n(r) / max) * 100}%"></div></span><span class="n">${n(r)}</span></div>`).join(''); };
async function load() {
  const d = await fetch(`/api/stats?days=${document.getElementById('days').value}`).then(r => r.json());
  const out = document.getElementById('out');
  if (!d.enabled) { out.textContent = d.error || 'Tracking is off (no database).'; return; }
  const s = d.sessions, f = d.firsts, b = d.boss, r = d.retention, l = d.lengths;
  out.innerHTML = `<div class="grid">
    ${card(s.sessions, 'sessions')}${card(s.characters, 'characters played')}
    ${card(mins(l.median_secs), 'median session length')}${card(mins(f.first_kill_secs), 'median time to first kill')}
    ${card(pct(f.sessions_with_party, s.sessions), `sessions that joined a party (${f.via_finder} via finder)`)}
    ${card(pct(f.sessions_reached_boss, s.sessions), 'sessions that reached the Warden')}
    ${card(`${b.kills} / ${b.wipes}`, 'Warden kills / wipes')}${card(mins(b.kill_secs), 'median Warden kill time')}
    ${card(pct(r.came_back, r.characters), 'characters that came back on another day')}
  </div>
  <h2>What kills players</h2>${bars(d.deaths, x => x.cause, x => x.n) || '<div class="sub">No deaths yet.</div>'}
  <h2>New-player guide: furthest step reached</h2>${bars(d.guide, x => GUIDE[x.step - 1] || `Step ${x.step}`, x => x.n) || '<div class="sub">No data yet.</div>'}
  <h2>Rare+ drops</h2>${bars(d.loot, x => RAR[x.rarity], x => x.n) || '<div class="sub">No data yet.</div>'}`;
}
document.getElementById('days').onchange = load;
load();
</script>
</body>
</html>
