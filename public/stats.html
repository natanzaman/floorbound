<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Floorbound · Play stats</title>
<style>
  body { margin: 0; font-family: system-ui, sans-serif; background: #0b1020; color: #eef3ff; }
  main { max-width: 860px; margin: 0 auto; padding: 24px 16px 48px; }
  h1 { font-size: 22px; letter-spacing: .12em; margin: 0 0 4px; }
  .sub { opacity: .65; margin-bottom: 20px; font-size: 14px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 10px; }
  .card { background: rgba(255,255,255,.05); border: 1px solid rgba(160,200,255,.18); border-radius: 12px; padding: 14px; }
  .card b { display: block; font-size: 26px; }
  .card span { font-size: 12px; opacity: .7; }
  h2 { font-size: 13px; letter-spacing: .14em; text-transform: uppercase; opacity: .6; margin: 26px 0 10px; }
  .row { display: flex; align-items: center; gap: 10px; margin: 5px 0; font-size: 14px; }
  .row .lbl { width: 190px; flex: none; }
  .row .bar { flex: 1; height: 12px; background: rgba(255,255,255,.08); border-radius: 6px; overflow: hidden; }
  .row .bar div { height: 100%; background: #60a5fa; }
  .row .n { width: 40px; text-align: right; opacity: .8; }
  table.floors { width: 100%; border-collapse: separate; border-spacing: 0; background: rgba(255,255,255,.05); border: 1px solid rgba(160,200,255,.18); border-radius: 12px; overflow: hidden; font-size: 14px; }
  table.floors th, table.floors td { padding: 9px 14px; text-align: right; border-bottom: 1px solid rgba(255,255,255,.06); }
  table.floors th:first-child, table.floors td:first-child { text-align: left; opacity: .75; font-weight: 400; }
  table.floors thead th { font-size: 12px; letter-spacing: .1em; text-transform: uppercase; opacity: .85; }
  table.floors thead th small { display: block; font-size: 11px; letter-spacing: 0; text-transform: none; opacity: .6; font-weight: 400; }
  table.floors td b { font-size: 18px; }
  table.floors tr:last-child td { border-bottom: 0; }
  .fl { font-size: 10px; padding: 1px 5px; border-radius: 4px; background: rgba(96,165,250,.25); margin-right: 6px; }
  .fl.f2 { background: rgba(45,212,191,.28); }
  select { background: #1b2340; color: #fff; border: 1px solid #334; border-radius: 6px; padding: 4px 8px; }
  /* admin part (public/stats-admin.js) */
  .recent .nw { white-space: nowrap; }
  .recent .nc { opacity: .5; font-size: 12px; }
  .recent .win { color: #6ee7b7; }
  .recent .mf { display: inline-block; margin: 1px 10px 1px 0; white-space: nowrap; font-size: 12px; }
  .recent .mf em { font-style: normal; opacity: .6; }
  .recent .mf .bt { font-size: 9px; margin-left: 3px; padding: 0 3px; border-radius: 3px; background: rgba(148,163,184,.25); }
  :root { --s0: #5b6478; --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; }
  #adm { margin-top: 40px; padding-top: 22px; border-top: 1px solid rgba(160,200,255,.18); }
  h1.adm { font-size: 18px; }
  .note { margin-top: 8px; }
  .panel { background: rgba(255,255,255,.04); border: 1px solid rgba(160,200,255,.14); border-radius: 12px; padding: 12px 14px; margin-bottom: 10px; min-width: 0; overflow-x: auto; }
  .panel h3 { margin: 0 0 2px; font-size: 14px; }
  .panel .q { font-size: 12px; opacity: .6; margin-bottom: 10px; }
  .two { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(380px, 100%), 1fr)); gap: 10px; }
  @media (max-width: 520px) { #adm .row .lbl { width: 120px !important; } .seg { float: none; display: block; margin-top: 6px; } }
  .grid + .panel, .grid + .two { margin-top: 10px; }
  .row .lbl { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row .bar .stack { display: flex; gap: 2px; height: 100%; }
  .row .bar .stack div { height: 100%; min-width: 2px; border-radius: 0; }
  .row .bar .stack div:last-child { border-radius: 0 4px 4px 0; }
  .row .bar { background: rgba(255,255,255,.05); }
  .row .bar.tall { height: 20px; }
  .row .bar.tall em { font-style: normal; font-size: 11px; line-height: 20px; padding-left: 6px; color: #f0efec; white-space: nowrap; overflow: hidden; display: block; text-shadow: 0 1px 2px #000; }
  .row .n { width: auto; min-width: 40px; white-space: nowrap; font-size: 12px; }
  .lg { display: flex; flex-wrap: wrap; gap: 12px; font-size: 12px; opacity: .85; margin-bottom: 8px; }
  .lg i, .who i, .tcard h4 i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }
  .cols { display: flex; align-items: flex-end; gap: 6px; }
  .col { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; min-width: 0; }
  .cstack { width: 100%; max-width: 46px; display: flex; flex-direction: column; gap: 2px; }
  .cstack div { min-height: 2px; }
  .cstack div:first-child { border-radius: 4px 4px 0 0; }
  .cv { font-size: 11px; opacity: .75; margin-bottom: 3px; }
  .cl { font-size: 11px; opacity: .65; margin-top: 5px; white-space: nowrap; }
  table.tbl, table.pgrid { width: 100%; border-collapse: collapse; font-size: 13px; }
  table.tbl th, table.pgrid th { text-align: left; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; opacity: .6; font-weight: 500; padding: 4px 6px; }
  table.tbl td { padding: 6px; border-top: 1px solid rgba(255,255,255,.06); vertical-align: middle; }
  table.pgrid th { text-align: center; }
  table.pgrid td { padding: 8px; text-align: center; border: 2px solid #0b1020; border-radius: 6px; font-variant-numeric: tabular-nums; }
  table.pgrid td:first-child { text-align: left; background: none; opacity: .8; }
  .ib { display: inline-block; width: 90px; height: 8px; background: rgba(255,255,255,.07); border-radius: 4px; overflow: hidden; margin-right: 8px; vertical-align: 0; }
  .ib span { display: block; height: 100%; border-radius: 0 4px 4px 0; }
  .who { display: inline-flex; align-items: center; margin-right: 10px; white-space: nowrap; }
  .tag { font-size: 11px; padding: 1px 6px; border-radius: 4px; background: rgba(201,133,0,.25); }
  .tgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 10px; }
  .tcard { background: rgba(255,255,255,.03); border-radius: 10px; padding: 10px; }
  .tcard h4 { margin: 0 0 8px; font-size: 13px; } .tcard h4 small { opacity: .55; font-weight: 400; margin-left: 4px; }
  .trow { display: flex; align-items: center; gap: 6px; font-size: 12px; margin: 4px 0; }
  .trow span:first-child { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .trow .ib { width: 60px; margin: 0; } .trow b { width: 36px; text-align: right; font-weight: 500; opacity: .85; }
  .seg { float: right; text-transform: none; letter-spacing: 0; }
  .seg button { background: #1b2340; color: #cfe0ff; border: 1px solid #334; padding: 3px 10px; font-size: 12px; cursor: pointer; }
  .seg button:first-child { border-radius: 6px 0 0 6px; } .seg button:last-child { border-radius: 0 6px 6px 0; }
  .seg button.on { background: #3987e5; color: #fff; border-color: #3987e5; }
  #tip { position: fixed; display: none; pointer-events: none; background: #f0efec; color: #0b0b0b; font-size: 12px; padding: 5px 8px; border-radius: 6px; max-width: 280px; z-index: 9; box-shadow: 0 4px 14px rgba(0,0,0,.4); }
  main { max-width: 1040px; }
</style>
</head>
<body>
<main>
  <h1>FLOORBOUND · PLAY STATS</h1>
  <div class="sub">How people actually play. Last <select id="days"><option>1</option><option selected>7</option><option>30</option></select> days.</div>
  <div id="out">Loading…</div>
  <section id="adm"></section>
</main>
<div id="tip"></div>
<script>
const GUIDE = ['Moved', 'First hit', 'Dodged', 'First kill', 'Opened bag / potion', 'Joined a party', 'First Switch', 'Reached the Warden', 'Beat the Warden'];
const FLOORS = { 1: ['Floor 1', 'The Horned Warden'], 2: ['Floor 2', 'The Drowned Sovereign'] };
const RAR = ['Common', 'Uncommon', 'Rare', 'Epic', 'Last Attack'];
const pct = (a, b) => (b ? Math.round((a / b) * 100) : 0) + '%';
const mins = s => (s == null ? '–' : s < 90 ? `${Math.round(s)} s` : `${(s / 60).toFixed(1)} min`);
const card = (v, label) => `<div class="card"><b>${v}</b><span>${label}</span></div>`;
const bars = (rows, label, n) => { const max = Math.max(1, ...rows.map(n)); return rows.map(r => `<div class="row"><span class="lbl">${label(r)}</span><span class="bar"><div style="width:${(n(r) / max) * 100}%"></div></span><span class="n">${n(r)}</span></div>`).join(''); };
async function load() {
  const d = await fetch(`/api/stats?days=${document.getElementById('days').value}`).then(r => r.json());
  const out = document.getElementById('out');
  if (!d.enabled) { out.textContent = d.error || 'Tracking is off (no database).'; return; }
  const s = d.sessions, f = d.firsts, r = d.retention, l = d.lengths;
  const fl = d.floors || { 1: { ...d.boss, sessions_reached_boss: f.sessions_reached_boss } }; // older servers: Floor 1 only
  const ids = Object.keys(fl);
  const row = (label, v) => `<tr><td>${label}</td>${ids.map(k => `<td><b>${v(fl[k])}</b></td>`).join('')}</tr>`;
  const bossTable = `<table class="floors"><thead><tr><th></th>${ids.map(k => `<th>${(FLOORS[k] || [`Floor ${k}`])[0]}<small>${(FLOORS[k] || ['', 'Boss'])[1]}</small></th>`).join('')}</tr></thead><tbody>
    ${row('Sessions that reached the boss', x => `${x.sessions_reached_boss} <small style="opacity:.6">(${pct(x.sessions_reached_boss, s.sessions)})</small>`)}
    ${row('Boss kills', x => x.kills)}${row('Boss wipes', x => x.wipes)}
    ${row('Kill rate (kills / attempts)', x => pct(x.kills, x.kills + x.wipes))}
    ${row('Median kill time', x => mins(x.kill_secs))}
    ${row('Player deaths on the floor', x => x.deaths ?? '–')}
  </tbody></table>`;
  const floorTag = n => `<span class="fl ${n === 2 ? 'f2' : ''}">F${n || 1}</span>`;
  out.innerHTML = `<div class="grid">
    ${card(s.sessions, 'sessions')}${card(s.characters, 'characters played')}
    ${card(mins(l.median_secs), 'median session length')}${card(mins(f.first_kill_secs), 'median time to first kill')}
    ${card(pct(f.sessions_with_party, s.sessions), `sessions that joined a party (${f.via_finder} via finder)`)}
    ${card(pct(r.came_back, r.characters), 'characters that came back on another day')}
  </div>
  <h2>Floor bosses</h2>${bossTable}
  <h2>What kills players</h2>${bars(d.deaths, x => `${floorTag(x.floor)}${x.cause}`, x => x.n) || '<div class="sub">No deaths yet.</div>'}
  <h2>New-player guide: furthest step reached</h2>${bars(d.guide, x => GUIDE[x.step - 1] || `Step ${x.step}`, x => x.n) || '<div class="sub">No data yet.</div>'}
  <h2>Rare+ drops</h2>${bars(d.loot, x => RAR[x.rarity], x => x.n) || '<div class="sub">No data yet.</div>'}`;
}
document.getElementById('days').onchange = load;
load();
</script>
<script type="module" src="/stats-admin.js"></script>
</body>
</html>
