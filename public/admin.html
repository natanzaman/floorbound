<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Floorbound · Admin</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Cpath d=%22M50 5 80 50 50 95 20 50z%22 fill=%22%23fbbf24%22/%3E%3C/svg%3E" />
  <style>
    :root { --bg: #0b1020; --panel: rgba(255,255,255,.045); --line: rgba(160,200,255,.16); --text: #eef3ff; --dim: rgba(238,243,255,.62); --accent: #7aa7ff; --bad: #f87171; --good: #4ade80; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 "Segoe UI", system-ui, sans-serif; }
    header { display: flex; align-items: center; gap: 18px; padding: 14px 22px; border-bottom: 1px solid var(--line); background: rgba(255,255,255,.02); position: sticky; top: 0; z-index: 5; backdrop-filter: blur(6px); }
    h1 { margin: 0; font-size: 17px; letter-spacing: .14em; }
    h1 small { font-weight: 400; letter-spacing: .04em; opacity: .55; margin-left: 6px; }
    nav { display: flex; gap: 4px; }
    nav button { background: none; border: 0; color: var(--dim); padding: 8px 14px; border-radius: 8px; font: inherit; font-weight: 600; cursor: pointer; }
    nav button.on { background: rgba(122,167,255,.16); color: var(--text); }
    nav button:disabled { opacity: .3; cursor: default; }
    header .who { margin-left: auto; color: var(--dim); font-size: 13px; }
    main { padding: 20px 22px 60px; max-width: 1280px; }
    .hidden { display: none !important; }
    .card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; margin-bottom: 16px; }
    .card h2 { margin: 0 0 10px; font-size: 13px; letter-spacing: .1em; text-transform: uppercase; color: var(--dim); }
    button, .btn { font: inherit; color: #fff; padding: 7px 13px; border-radius: 8px; border: 1px solid rgba(160,200,255,.35); background: rgba(120,170,255,.15); cursor: pointer; }
    button:hover { background: rgba(120,170,255,.26); }
    button.primary { background: #3b6fe0; border-color: #3b6fe0; }
    button.danger { border-color: rgba(248,113,113,.55); background: rgba(248,113,113,.14); }
    button.small { padding: 3px 9px; font-size: 12px; }
    input, select, textarea { font: inherit; color: var(--text); background: rgba(0,0,0,.28); border: 1px solid var(--line); border-radius: 7px; padding: 6px 8px; }
    input[type=number] { width: 90px; }
    input[type=checkbox] { accent-color: var(--accent); }
    label.f { display: inline-flex; flex-direction: column; gap: 3px; font-size: 12px; color: var(--dim); margin: 0 12px 10px 0; vertical-align: top; }
    .row { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 8px; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th { text-align: left; font-weight: 600; color: var(--dim); padding: 6px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; user-select: none; }
    th[data-sort] { cursor: pointer; }
    th.sorted::after { content: ' ▾'; } th.sorted.asc::after { content: ' ▴'; }
    td { padding: 6px 8px; border-bottom: 1px solid rgba(255,255,255,.05); vertical-align: middle; }
    tr.click { cursor: pointer; } tr.click:hover td { background: rgba(122,167,255,.08); }
    .hp { width: 110px; height: 7px; border-radius: 4px; background: rgba(255,255,255,.1); overflow: hidden; display: inline-block; vertical-align: middle; margin-right: 6px; }
    .hp div { height: 100%; background: var(--good); }
    .pill { display: inline-block; font-size: 11px; padding: 1px 7px; border-radius: 10px; background: rgba(255,255,255,.08); }
    .pill.on { background: rgba(74,222,128,.2); color: #bbf7d0; } .pill.bot { background: rgba(251,191,36,.18); color: #fde68a; } .pill.adm { background: rgba(192,132,252,.2); color: #e9d5ff; }
    .dim { color: var(--dim); }
    .msg { padding: 8px 12px; border-radius: 8px; margin: 0 0 12px; }
    .msg.err { background: rgba(248,113,113,.15); border: 1px solid rgba(248,113,113,.4); }
    .msg.ok { background: rgba(74,222,128,.12); border: 1px solid rgba(74,222,128,.35); }
    #gate { max-width: 560px; margin: 80px auto; text-align: center; }
    #gate .card { padding: 26px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(330px, 1fr)); gap: 16px; }
    .grid .card { margin: 0; }
    .items .it { display: flex; align-items: center; gap: 8px; padding: 5px 0; border-bottom: 1px solid rgba(255,255,255,.05); }
    .items .it .nm { flex: 1; min-width: 150px; } .items .it .st { color: var(--dim); font-size: 12px; }
    .items .slot { width: 64px; color: var(--dim); font-size: 12px; text-transform: capitalize; }
    textarea { width: 100%; min-height: 220px; font: 12px/1.4 ui-monospace, Menlo, monospace; }
    .titles label { display: inline-flex; align-items: center; gap: 5px; margin: 0 14px 6px 0; font-size: 13px; }
    .sticky-save { position: sticky; bottom: 0; z-index: 2; padding: 10px 0; margin-bottom: 16px; background: rgba(11,16,32,.94); border-top: 1px solid var(--line); display: flex; gap: 10px; align-items: center; }
    .lead { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
    .lead h2 { margin: 0; font-size: 22px; letter-spacing: .02em; }
  </style>
</head>
<body>
  <header>
    <h1>FLOORBOUND <small>admin</small></h1>
    <nav id="tabs" class="hidden">
      <button data-tab="bots" class="on">Bots</button>
      <button data-tab="players">Players</button>
      <button data-tab="edit" disabled>Edit</button>
    </nav>
    <span class="who" id="who"></span>
  </header>

  <div id="gate" class="hidden"><div class="card"><h2 style="font-size:15px">Admins only</h2><p id="gate-text" class="dim"></p><a class="btn" href="/">Open the game</a></div></div>

  <main id="app" class="hidden">
    <div id="flash"></div>

    <!-- BOTS -->
    <section id="tab-bots">
      <div class="card">
        <h2>Add bots</h2>
        <div class="row">
          <label class="f">Class<select id="b-cls"></select></label>
          <label class="f">Name (optional)<input id="b-name" maxlength="16" placeholder="auto" style="width:130px" /></label>
          <label class="f">Starting level<input id="b-lvl" type="number" min="1" value="1" /></label>
          <label class="f">Behaviour<select id="b-beh"></select></label>
          <label class="f" id="b-follow-wrap">Player to follow<select id="b-follow"></select></label>
          <button class="primary" id="b-add">Add bot</button>
          <button id="b-team" title="Guardian, Swordsman and Cleric with the level and behaviour above">Add team (3 roles)</button>
          <span style="flex:1"></span>
          <button class="danger" id="b-clear">Remove all bots</button>
        </div>
        <div class="dim" id="b-count" style="font-size:12px"></div>
      </div>
      <div class="card">
        <h2>Running bots</h2>
        <table><thead><tr><th>Name</th><th>Class</th><th>Lv</th><th>HP</th><th>Floor / area</th><th>Party</th><th>Behaviour</th><th></th></tr></thead><tbody id="b-rows"></tbody></table>
      </div>
    </section>

    <!-- PLAYERS -->
    <section id="tab-players" class="hidden">
      <div class="card">
        <div class="row" style="margin-bottom:10px">
          <input id="p-search" placeholder="Search name or account…" style="width:260px" />
          <select id="p-filter"><option value="all">All characters</option><option value="online">Online</option><option value="offline">Offline</option></select>
          <span class="dim" id="p-count" style="margin-left:8px"></span>
          <span style="flex:1"></span>
          <button id="p-refresh">Refresh</button>
        </div>
        <table><thead><tr>
          <th data-sort="name">Name</th><th data-sort="cls">Class</th><th data-sort="lvl">Lv</th><th data-sort="account">Account</th>
          <th data-sort="online">Status</th><th data-sort="area">Area</th><th data-sort="lastSeen">Last seen</th><th data-sort="created">Created</th>
        </tr></thead><tbody id="p-rows"></tbody></table>
      </div>
      <div class="card" id="p-extra"></div>
    </section>

    <!-- EDIT -->
    <section id="tab-edit" class="hidden"><div id="e-body"></div></section>
  </main>

  <script type="module" src="/admin.js"></script>
</body>
</html>
