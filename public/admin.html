<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Floorbound · Admin</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Cpath d=%22M50 5 80 50 50 95 20 50z%22 fill=%22%23fbbf24%22/%3E%3C/svg%3E" />
  <style>
    :root {
      --bg: #070b18; --bg2: #0b1124; --panel: rgba(14,21,44,.78); --panel2: rgba(255,255,255,.035); --line: rgba(160,200,255,.14); --line2: rgba(160,200,255,.26);
      --text: #eef3ff; --dim: rgba(220,230,255,.58); --faint: rgba(220,230,255,.36); --accent: #7aa7ff; --accent2: #9c7bff;
      --bad: #f87171; --good: #4ade80; --warn: #fbbf24; --gold: #fbbf24; --r: 12px;
      --s1: #f87171; --s2: #fb923c; --s3: #facc15; --s4: #4ade80; --s5: #c084fc;
    }
    * { box-sizing: border-box; }
    html { color-scheme: dark; }
    body { margin: 0; min-height: 100vh; color: var(--text); font: 13.5px/1.45 "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
      background: radial-gradient(1200px 600px at 15% -10%, rgba(59,130,246,.16), transparent 60%), radial-gradient(900px 500px at 100% 0%, rgba(124,58,237,.13), transparent 60%), var(--bg); background-attachment: fixed; }
    .hidden { display: none !important; }
    a { color: var(--accent); }
    svg.i { width: 15px; height: 15px; vertical-align: -3px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

    /* ---------- header ---------- */
    header { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 22px; padding: 10px 22px; background: rgba(7,11,24,.86); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
    .logo { font-weight: 800; letter-spacing: .26em; font-size: 16px; background: linear-gradient(180deg, #fff, #9cc4ff); -webkit-background-clip: text; background-clip: text; color: transparent; white-space: nowrap; }
    .logo-tag { font-size: 10px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; padding: 2px 7px; border-radius: 6px; color: #e9d5ff; background: rgba(192,132,252,.18); border: 1px solid rgba(192,132,252,.35); margin-left: -12px; }
    nav { display: flex; gap: 2px; background: rgba(255,255,255,.04); border: 1px solid var(--line); border-radius: 10px; padding: 3px; }
    nav button { display: inline-flex; align-items: center; gap: 7px; background: none; border: 0; color: var(--dim); padding: 6px 14px; border-radius: 7px; font: inherit; font-weight: 600; cursor: pointer; }
    nav button:hover:not(:disabled) { color: var(--text); background: rgba(255,255,255,.05); }
    nav button.on { color: #fff; background: linear-gradient(180deg, rgba(122,167,255,.32), rgba(122,167,255,.16)); box-shadow: inset 0 0 0 1px rgba(122,167,255,.35); }
    nav button:disabled { opacity: .3; cursor: default; }
    nav .count { font-size: 11px; padding: 0 6px; border-radius: 8px; background: rgba(255,255,255,.1); color: var(--text); }
    header .who { margin-left: auto; color: var(--dim); font-size: 12.5px; display: flex; align-items: center; gap: 8px; }
    header .who .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--good); box-shadow: 0 0 8px var(--good); }

    /* ---------- summary strip ---------- */
    #strip { display: grid; grid-template-columns: repeat(4, minmax(150px, 1fr)) minmax(280px, 2.2fr); gap: 12px; padding: 16px 22px 4px; max-width: 1480px; }
    .stat { position: relative; overflow: hidden; background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 11px 14px 12px; }
    .stat::before { content: ''; position: absolute; inset: 0 auto 0 0; width: 3px; background: var(--c, var(--accent)); opacity: .9; }
    .stat .k { font-size: 10.5px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--dim); display: flex; align-items: center; gap: 6px; }
    .stat .v { font-size: 24px; font-weight: 700; margin-top: 2px; font-variant-numeric: tabular-nums; letter-spacing: .01em; }
    .stat .v small { font-size: 13px; color: var(--dim); font-weight: 500; margin-left: 4px; }
    .stat .sub { font-size: 12px; color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .stat.twist .v { font-size: 19px; margin-top: 5px; }
    .clears { list-style: none; margin: 4px 0 0; padding: 0; font-size: 12px; }
    .clears li { display: flex; gap: 8px; align-items: center; padding: 2px 0; color: var(--dim); white-space: nowrap; overflow: hidden; }
    .clears li b { color: var(--text); font-weight: 600; font-variant-numeric: tabular-nums; }
    .clears .fl { font-size: 10px; font-weight: 700; padding: 0 5px; border-radius: 4px; background: rgba(251,191,36,.16); color: var(--gold); }
    .clears .names { overflow: hidden; text-overflow: ellipsis; flex: 1; }

    main { padding: 14px 22px 90px; max-width: 1480px; }
    .card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; margin-bottom: 14px; }
    .card > h2, .sec-h { margin: 0 0 12px; font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--dim); font-weight: 700; display: flex; align-items: center; gap: 8px; }
    .sec-h .grow, .grow { flex: 1; }

    /* ---------- controls ---------- */
    button, .btn { font: inherit; font-size: 13px; color: var(--text); padding: 6px 12px; border-radius: 8px; border: 1px solid var(--line2); background: rgba(120,170,255,.1); cursor: pointer; display: inline-flex; align-items: center; gap: 6px; text-decoration: none; white-space: nowrap; }
    button:hover:not(:disabled) { background: rgba(120,170,255,.2); border-color: rgba(160,200,255,.45); }
    button:disabled { opacity: .4; cursor: default; }
    button.primary { border: 0; font-weight: 700; background: linear-gradient(90deg, #3b82f6, #7c3aed); box-shadow: 0 4px 16px rgba(80,110,255,.25); }
    button.primary:hover:not(:disabled) { filter: brightness(1.12); background: linear-gradient(90deg, #3b82f6, #7c3aed); }
    button.danger { border-color: rgba(248,113,113,.45); background: rgba(248,113,113,.1); color: #fecaca; }
    button.danger:hover:not(:disabled) { background: rgba(248,113,113,.22); border-color: rgba(248,113,113,.7); }
    button.ghost { background: transparent; border-color: transparent; color: var(--dim); }
    button.ghost:hover:not(:disabled) { color: var(--text); background: rgba(255,255,255,.06); border-color: var(--line); }
    button.small { padding: 3px 8px; font-size: 12px; border-radius: 7px; }
    button.icon { padding: 4px 6px; }
    input, select, textarea { font: inherit; font-size: 13px; color: var(--text); background: rgba(0,0,0,.32); border: 1px solid var(--line); border-radius: 8px; padding: 6px 9px; outline: none; }
    input:focus, select:focus, textarea:focus { border-color: rgba(122,167,255,.6); box-shadow: 0 0 0 3px rgba(122,167,255,.15); }
    select { padding-right: 6px; }
    input[type=number] { width: 90px; }
    input[type=checkbox] { accent-color: var(--accent); }
    label.f { display: inline-flex; flex-direction: column; gap: 4px; font-size: 11.5px; color: var(--dim); margin: 0 12px 10px 0; vertical-align: top; white-space: nowrap; }
    .row { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 10px; }
    .row.c { align-items: center; }
    .dim { color: var(--dim); } .faint { color: var(--faint); }

    /* stepper */
    .step { display: inline-flex; align-items: stretch; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: rgba(0,0,0,.3); }
    .step button { border: 0; border-radius: 0; padding: 0 9px; background: rgba(255,255,255,.04); font-weight: 700; }
    .step input { border: 0; border-radius: 0; width: 46px; text-align: center; background: transparent; box-shadow: none !important; padding: 5px 2px; -moz-appearance: textfield; }
    .step input::-webkit-inner-spin-button { -webkit-appearance: none; }
    /* capability segmented control */
    .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: rgba(0,0,0,.3); }
    .seg button { border: 0; border-radius: 0; padding: 4px 9px; background: transparent; color: var(--dim); font-weight: 700; font-size: 12px; border-right: 1px solid var(--line); }
    .seg button:last-child { border-right: 0; }
    .seg button.on { color: #0b1020; background: var(--sc); }
    .seg.big button { padding: 6px 12px; font-size: 13px; }
    .skill-tag { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 700; padding: 1px 8px; border-radius: 10px; color: var(--sc); background: color-mix(in srgb, var(--sc) 14%, transparent); border: 1px solid color-mix(in srgb, var(--sc) 40%, transparent); }
    .skill-desc { white-space: normal; font-size: 12px; color: var(--dim); margin-top: 6px; min-height: 18px; }

    /* pills / class chips */
    .pill { display: inline-flex; align-items: center; gap: 4px; font-size: 10.5px; font-weight: 700; letter-spacing: .04em; padding: 1px 7px; border-radius: 10px; background: rgba(255,255,255,.08); color: var(--dim); }
    .pill.on { background: rgba(74,222,128,.16); color: #bbf7d0; } .pill.bot { background: rgba(251,191,36,.16); color: #fde68a; } .pill.adm { background: rgba(192,132,252,.18); color: #e9d5ff; } .pill.team { background: rgba(122,167,255,.16); color: #c7d8ff; }
    .pill.on::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: var(--good); }
    .cls-ico { display: inline-grid; place-items: center; width: 26px; height: 26px; border-radius: 8px; color: var(--cc); background: color-mix(in srgb, var(--cc) 16%, transparent); border: 1px solid color-mix(in srgb, var(--cc) 45%, transparent); flex: none; font-weight: 800; font-size: 12px; }
    .cls-ico svg { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .cls-ico.sm { width: 20px; height: 20px; border-radius: 6px; } .cls-ico.sm svg { width: 12px; height: 12px; }
    .cls-name { color: var(--cc); font-weight: 600; }

    /* ---------- bots tab ---------- */
    .bots-layout { display: grid; grid-template-columns: 380px 1fr; gap: 14px; align-items: start; }
    .add-card { position: sticky; top: 70px; }
    .presets { display: grid; grid-template-columns: 1fr; gap: 6px; margin-bottom: 14px; }
    .preset { justify-content: flex-start; text-align: left; padding: 8px 10px; background: rgba(255,255,255,.035); border-color: var(--line); }
    .preset .pi { display: grid; place-items: center; width: 28px; height: 28px; border-radius: 8px; background: rgba(122,167,255,.14); color: #c7d8ff; flex: none; }
    .preset b { display: block; font-size: 13px; } .preset span.d { display: block; font-size: 11.5px; color: var(--dim); white-space: normal; }
    .cls-pick { display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 6px; margin-bottom: 12px; }
    .cls-pick button { min-width: 0; flex-direction: column; align-items: flex-start; gap: 2px; padding: 7px 7px; background: rgba(255,255,255,.03); border-color: var(--line); }
    .cls-pick button .nm { gap: 4px !important; font-size: 11.5px; max-width: 100%; overflow: hidden; text-overflow: ellipsis; font-weight: 700; color: var(--cc); display: flex; align-items: center; gap: 6px; }
    .cls-pick button .rl { font-size: 10.5px; color: var(--dim); text-transform: uppercase; letter-spacing: .08em; }
    .cls-pick button.on { border-color: var(--cc); background: color-mix(in srgb, var(--cc) 13%, transparent); box-shadow: inset 0 0 0 1px var(--cc); }
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 12px; }
    .form-grid label.f { margin: 0; align-items: flex-start; }
    .form-grid .step input { width: 46px; }
    .form-grid .full { grid-column: 1 / -1; }
    .form-grid input, .form-grid select { width: 100%; }
    .add-actions { display: flex; gap: 8px; margin-top: 14px; flex-wrap: wrap; }
    .add-actions .primary { flex: 1; justify-content: center; }
    .divider { height: 1px; background: var(--line); margin: 14px -16px; }

    .bots-head { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; flex-wrap: wrap; }
    .bots-head h2 { margin: 0; font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--dim); }
    .bot-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); gap: 12px; }
    .botcard { position: relative; background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 13px 11px 16px; overflow: hidden; transition: border-color .15s, opacity .2s; }
    .botcard::before { content: ''; position: absolute; inset: 0 auto 0 0; width: 4px; background: var(--cc); }
    .botcard:hover { border-color: var(--line2); }
    .botcard.down { opacity: .72; }
    .botcard.joining { opacity: .5; }
    .botcard .top { display: flex; align-items: center; gap: 9px; }
    .botcard .nm { font-weight: 700; font-size: 15px; background: transparent; border: 1px solid transparent; padding: 1px 5px; margin-left: -5px; width: 150px; border-radius: 6px; }
    .botcard .nm:hover { border-color: var(--line); } .botcard .nm:focus { background: rgba(0,0,0,.35); }
    .botcard .meta { font-size: 12px; color: var(--dim); display: flex; gap: 6px; align-items: center; flex-wrap: wrap; margin: 7px 0 8px; }
    .botcard .meta .sep { opacity: .4; }
    .botcard .goal { font-size: 12px; margin: 6px 0 2px; min-height: 15px; color: var(--fg, #e2e8f0); }
    .botcard .goal .dim { color: var(--dim); }
    .botcard .goal .ord { color: #86efac; }
    .hp { position: relative; height: 16px; border-radius: 5px; background: rgba(255,255,255,.07); overflow: hidden; }
    .hp > div { position: absolute; inset: 0 auto 0 0; background: linear-gradient(90deg, #16a34a, #4ade80); transition: width .4s; }
    .hp.low > div { background: linear-gradient(90deg, #b91c1c, #f87171); }
    .hp span { position: absolute; inset: 0; display: grid; place-items: center; font-size: 10.5px; font-weight: 700; text-shadow: 0 1px 2px #000; font-variant-numeric: tabular-nums; }
    .botcard .ctl { display: grid; grid-template-columns: auto 1fr; gap: 7px 10px; align-items: center; margin-top: 10px; font-size: 11.5px; color: var(--dim); }
    .botcard .ctl select { width: 100%; padding: 4px 6px; font-size: 12px; }
    .botcard .beh { display: flex; gap: 6px; } .botcard .beh select { flex: 1; min-width: 0; }
    .botcard .acts { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--line); }
    .botcard .acts select { padding: 3px 5px; font-size: 12px; max-width: 130px; }
    .empty { text-align: center; padding: 40px 10px; color: var(--dim); border: 1px dashed var(--line2); border-radius: var(--r); }

    /* ---------- tables (players) ---------- */
    .filters { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 12px; }
    .search { position: relative; } .search input { padding-left: 30px; width: 260px; } .search svg { position: absolute; left: 9px; top: 8px; color: var(--faint); }
    .chips { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
    .chips button { border: 0; border-radius: 0; background: transparent; color: var(--dim); padding: 5px 11px; border-right: 1px solid var(--line); }
    .chips button:last-child { border-right: 0; } .chips button.on { background: rgba(122,167,255,.2); color: #fff; }
    .lvr { display: inline-flex; align-items: center; gap: 5px; color: var(--dim); font-size: 12px; } .lvr input { width: 56px; }
    table { width: 100%; border-collapse: separate; border-spacing: 0; font-size: 13px; }
    th { position: sticky; top: 56px; z-index: 1; text-align: left; font-weight: 700; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--dim); padding: 8px 10px; border-bottom: 1px solid var(--line2); white-space: nowrap; user-select: none; background: #0d142b; }
    th[data-sort] { cursor: pointer; } th[data-sort]:hover { color: var(--text); }
    th.sorted { color: #c7d8ff; } th.sorted::after { content: ' ▾'; } th.sorted.asc::after { content: ' ▴'; }
    td { padding: 8px 10px; border-bottom: 1px solid rgba(255,255,255,.045); vertical-align: middle; }
    tr.click { cursor: pointer; } tr.click:hover td { background: rgba(122,167,255,.07); }
    td .who { display: flex; align-items: center; gap: 9px; }
    .lv { font-weight: 700; font-variant-numeric: tabular-nums; }
    .lvbar { display: inline-block; width: 50px; height: 4px; border-radius: 2px; background: rgba(255,255,255,.08); vertical-align: middle; margin-left: 6px; overflow: hidden; } .lvbar i { display: block; height: 100%; background: var(--accent); }

    /* ---------- editor ---------- */
    .lead { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; margin-bottom: 12px; }
    .lead .cls-ico { width: 44px; height: 44px; border-radius: 12px; } .lead .cls-ico svg { width: 24px; height: 24px; }
    .lead h2 { margin: 0; font-size: 24px; letter-spacing: .01em; line-height: 1.1; }
    .lead .sub { color: var(--dim); font-size: 12.5px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 3px; }
    .secnav { display: flex; gap: 4px; flex-wrap: wrap; margin-bottom: 14px; position: sticky; top: 56px; z-index: 3; padding: 8px 0; background: linear-gradient(180deg, rgba(7,11,24,.96) 70%, transparent); }
    .secnav a { font-size: 12px; font-weight: 600; text-decoration: none; color: var(--dim); padding: 4px 10px; border-radius: 7px; border: 1px solid var(--line); }
    .secnav a:hover { color: var(--text); border-color: var(--line2); }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 14px; margin-bottom: 14px; }
    .grid .card { margin: 0; }
    section.esec { scroll-margin-top: 110px; }
    .items .it { display: flex; align-items: center; gap: 8px; padding: 6px 0; border-bottom: 1px solid rgba(255,255,255,.05); }
    .items .it .nm { flex: 1; min-width: 150px; font-weight: 600; } .items .it .st { color: var(--dim); font-size: 12px; }
    .items .slot { width: 64px; color: var(--faint); font-size: 11px; text-transform: uppercase; letter-spacing: .06em; }
    textarea { width: 100%; min-height: 220px; font: 12px/1.45 ui-monospace, Menlo, Consolas, monospace; }
    .titles label { display: inline-flex; align-items: center; gap: 5px; margin: 0 14px 6px 0; font-size: 13px; }
    .savebar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 15; display: flex; gap: 12px; align-items: center; padding: 10px 22px; background: rgba(9,14,30,.94); backdrop-filter: blur(8px); border-top: 1px solid var(--line2); box-shadow: 0 -8px 30px rgba(0,0,0,.35); }
    .danger-zone { border-color: rgba(248,113,113,.35); } .danger-zone > h2 { color: #fca5a5; }

    /* ---------- toasts ---------- */
    #toasts { position: fixed; right: 18px; bottom: 70px; z-index: 50; display: flex; flex-direction: column; gap: 8px; align-items: flex-end; pointer-events: none; }
    .toast { pointer-events: auto; display: flex; gap: 9px; align-items: flex-start; min-width: 240px; max-width: 420px; padding: 10px 14px; border-radius: 10px; background: rgba(14,21,44,.97); border: 1px solid var(--line2); box-shadow: 0 10px 30px rgba(0,0,0,.45); font-size: 13px; animation: tin .18s ease-out; }
    .toast.ok { border-color: rgba(74,222,128,.5); } .toast.ok .ti { color: var(--good); }
    .toast.err { border-color: rgba(248,113,113,.6); } .toast.err .ti { color: var(--bad); }
    .toast.out { opacity: 0; transform: translateY(6px); transition: .25s; }
    @keyframes tin { from { opacity: 0; transform: translateY(8px); } }
    .body-pad { height: 60px; }

    #gate { max-width: 560px; margin: 90px auto; text-align: center; } #gate .card { padding: 28px; }

    @media (max-width: 1180px) {
      #strip { grid-template-columns: repeat(4, 1fr); } #strip .stat.recent { grid-column: 1 / -1; }
      .bots-layout { grid-template-columns: 1fr; } .add-card { position: static; }
      .presets { grid-template-columns: repeat(3, 1fr); }
    }
    @media (max-width: 760px) { #strip { grid-template-columns: repeat(2, 1fr); } .presets { grid-template-columns: 1fr; } header { flex-wrap: wrap; gap: 10px; } }
  </style>
</head>
<body>
  <header>
    <span class="logo">FLOORBOUND</span><span class="logo-tag">admin</span>
    <nav id="tabs" class="hidden">
      <button data-tab="bots" class="on"><svg class="i" viewBox="0 0 24 24"><rect x="4" y="8" width="16" height="12" rx="3"/><path d="M12 4v4M9 14h.01M15 14h.01"/></svg>Bots <span class="count" id="n-bots">0</span></button>
      <button data-tab="players"><svg class="i" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6M16 4.5a3.5 3.5 0 0 1 0 7M21 20c0-2.6-1.6-4.8-4-5.6"/></svg>Players</button>
      <button data-tab="edit" disabled><svg class="i" viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16z"/></svg>Edit</button>
    </nav>
    <span class="who" id="who"></span>
  </header>

  <div id="gate" class="hidden"><div class="card"><h2 style="font-size:15px">Admins only</h2><p id="gate-text" class="dim"></p><a class="btn" href="/">Open the game</a></div></div>

  <div id="strip" class="hidden">
    <div class="stat" style="--c:#4ade80"><div class="k">Players online</div><div class="v" id="s-players">–</div><div class="sub" id="s-players-sub">&nbsp;</div></div>
    <div class="stat" style="--c:#fbbf24"><div class="k">Bots running</div><div class="v" id="s-bots">–</div><div class="sub" id="s-bots-sub">&nbsp;</div></div>
    <div class="stat" style="--c:#7aa7ff"><div class="k">Server uptime</div><div class="v" id="s-uptime">–</div><div class="sub" id="s-uptime-sub">&nbsp;</div></div>
    <div class="stat twist" id="s-twist-card"><div class="k">Warden twist</div><div class="v" id="s-twist">–</div><div class="sub" id="s-twist-sub">&nbsp;</div></div>
    <div class="stat recent" style="--c:#c084fc"><div class="k">Recent floor clears <span class="grow"></span><span id="s-clears-n" class="faint" style="letter-spacing:0;text-transform:none;font-weight:500"></span></div><ul class="clears" id="s-clears"></ul></div>
  </div>

  <main id="app" class="hidden">
    <!-- BOTS -->
    <section id="tab-bots">
      <div class="bots-layout">
        <div class="card add-card">
          <h2>Quick presets</h2>
          <div class="presets" id="presets"></div>
          <div class="divider"></div>
          <h2>Add a bot</h2>
          <div class="cls-pick" id="b-cls"></div>
          <div class="form-grid">
            <label class="f">Name (optional)<input id="b-name" maxlength="16" placeholder="auto" /></label>
            <label class="f">Starting level<span class="step" id="b-lvl-step"><button type="button" data-d="-1">−</button><input id="b-lvl" type="number" min="1" value="1" /><button type="button" data-d="1">+</button></span></label>
            <label class="f full">Capability<span class="seg big" id="b-skill"></span><span class="skill-desc" id="b-skill-desc"></span></label>
            <label class="f full">Behaviour<select id="b-beh"></select></label>
            <label class="f full" id="b-follow-wrap">Player to follow<select id="b-follow"></select></label>
          </div>
          <div class="add-actions">
            <button class="primary" id="b-add"><svg class="i" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>Add bot</button>
            <button id="b-team" title="One bot per role (Guardian, Swordsman, Cleric) with the level, capability and behaviour above">Add team (3 roles)</button>
          </div>
        </div>
        <div>
          <div class="bots-head">
            <h2>Running bots</h2><span class="dim" id="b-count" style="font-size:12px"></span><span class="grow"></span>
            <button class="danger small" id="b-clear"><svg class="i" viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>Remove all</button>
          </div>
          <div class="bot-grid" id="b-cards"></div>
        </div>
      </div>
    </section>

    <!-- PLAYERS -->
    <section id="tab-players" class="hidden">
      <div class="card">
        <div class="filters">
          <span class="search"><svg class="i" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6"/><path d="m20 20-4.5-4.5"/></svg><input id="p-search" placeholder="Search name or account…" /></span>
          <span class="chips" id="p-status"><button data-v="all" class="on">All</button><button data-v="online">Online</button><button data-v="offline">Offline</button></span>
          <select id="p-cls"></select>
          <span class="lvr">Lv <input id="p-lmin" type="number" min="1" placeholder="1" /> – <input id="p-lmax" type="number" min="1" placeholder="max" /></span>
          <span class="dim" id="p-count" style="margin-left:6px;font-size:12px"></span>
          <span class="grow"></span>
          <button id="p-refresh" class="ghost"><svg class="i" viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2.3 5.7M20 4v7h-7"/></svg>Refresh</button>
        </div>
        <table><thead><tr>
          <th data-sort="name">Character</th><th data-sort="cls">Class</th><th data-sort="lvl">Level</th><th data-sort="account">Account</th>
          <th data-sort="online">Status</th><th data-sort="area">Where</th><th data-sort="lastSeen">Last seen</th><th data-sort="created">Created</th>
        </tr></thead><tbody id="p-rows"></tbody></table>
      </div>
      <div class="card" id="p-extra"></div>
    </section>

    <!-- EDIT -->
    <section id="tab-edit" class="hidden"><div id="e-body"></div></section>
  </main>
  <div id="toasts"></div>

  <script type="module" src="/admin.js"></script>
</body>
</html>
